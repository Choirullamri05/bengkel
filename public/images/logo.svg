<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#1d4ed8"/>
  
  <!-- Welding arc / spark lines -->
  <line x1="32" y1="38" x2="20" y2="52" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="38" x2="14" y2="44" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="32" y1="38" x2="22" y2="55" stroke="#fcd34d" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Sparks dots -->
  <circle cx="18" cy="50" r="2" fill="#f59e0b" opacity="0.9"/>
  <circle cx="13" cy="43" r="1.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="21" cy="56" r="1" fill="#fcd34d" opacity="0.6"/>
  
  <!-- SS Text -->
  <text x="32" y="34" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22" fill="white" text-anchor="middle" dominant-baseline="middle" letter-spacing="-1">SS</text>
</svg>
